---
version: 2
project_name: chart-releaser

env:
  - COSIGN_YES=true

before:
  hooks:
    - go mod download

sboms:
  - artifacts: archive

builds:
  - main: cr/main.go
    binary: cr
    env:
      - CGO_ENABLED=0
    goarch:
      - amd64
      - arm
      - arm64
      - s390x
      - ppc64le
    goarm:
      - 7
    goos:
      - linux
      - darwin
      - windows
    ignore:
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: s390x
      - goos: windows
        goarch: ppc64le
    ldflags:
      - >-
        -X github.com/helm/chart-releaser/cr/cmd.Version={{ .Tag }}
        -X github.com/helm/chart-releaser/cr/cmd.GitCommit={{ .Commit }}
        -X github.com/helm/chart-releaser/cr/cmd.BuildDate={{ .Date }}

archives:
  - format_overrides:
      - goos: windows
        formats: ["zip"]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: 'checksums.txt'
snapshot:
  version_template: "{{ .Tag }}-next"

dockers_v2:
  - &docker_defaults
    id: multiarch
    dockerfile: Dockerfile
    images:
      - quay.io/helmpack/chart-releaser
      - ghcr.io/helm/chart-releaser
    tags:
      - '{{ .Tag }}'
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
      - linux/arm/v7
      - linux/s390x
      - linux/ppc64le
    # Snapshot builds remain available on forks; releases only publish upstream.
    disable: '{{ and (not .IsSnapshot) (ne .GitURL "https://github.com/helm/chart-releaser") }}'
    # Preserve the existing image format; archive SBOMs are configured above.
    sbom: false
    flags:
      - --provenance=false
    labels:
      org.label-schema.schema-version: '1.0'
      org.label-schema.version: '{{ .Version }}'
      org.label-schema.name: '{{ .ProjectName }}'
      org.label-schema.build-date: '{{ .Date }}'
      org.label-schema.description: cr - The chart release tool
      org.label-schema.vendor: Helm

  # Retain the published architecture-suffixed tags for existing consumers.
  - <<: *docker_defaults
    id: amd64
    tags: ['{{ .Tag }}-amd64', latest-amd64]
    platforms: [linux/amd64]
  - <<: *docker_defaults
    id: arm64
    tags: ['{{ .Tag }}-arm64', latest-arm64]
    platforms: [linux/arm64]
  - <<: *docker_defaults
    id: armv7
    tags: ['{{ .Tag }}-armv7', latest-armv7]
    platforms: [linux/arm/v7]
  - <<: *docker_defaults
    id: s390x
    tags: ['{{ .Tag }}-s390x', latest-s390x]
    platforms: [linux/s390x]
  - <<: *docker_defaults
    id: ppc64le
    tags: ['{{ .Tag }}-ppc64le', latest-ppc64le]
    platforms: [linux/ppc64le]

signs:
  - id: all
    signature: "${artifact}.sigstore.json"
    cmd: cosign
    args: ["sign-blob", "--bundle=${signature}", "${artifact}", "--yes"]
    artifacts: all

docker_signs:
  - id: images
    cmd: cosign
    args: ["sign", "${artifact}"]
    ids:
      - multiarch
